name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.site_env }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site_env: [preview, production]
    env:
      SITE_ENV: ${{ matrix.site_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run check:source
      - run: npm run build
      - run: npm run check:build
      - run: npm run check:budget
      - run: npm run check:migrations
